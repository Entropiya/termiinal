<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>terminal-mentor — этап 1</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <main class="shell">
      <header class="toolbar">
        <strong>Этап 1 — прототип рисков</strong>
        <button id="btn-spawn">Запустить Git Bash</button>
        <input id="ssh-target" value="root@192.168.70.167" size="20" title="user@host" />
        <button id="btn-ssh">Подключиться по SSH</button>
        <button id="btn-integrate" disabled>Внедрить интеграцию</button>
        <button id="btn-history" disabled>Проверить историю</button>
        <button id="btn-progress" disabled>Тест \r-перерисовки</button>
        <span id="status" class="status">не запущено</span>
      </header>

      <div class="panes">
        <section class="pane pane-term">
          <h2>Терминал (xterm.js)</h2>
          <div id="xterm"></div>
        </section>

        <section class="pane pane-side">
          <h2>Чек-лист этапа 1</h2>
          <ul id="checklist" class="checklist"></ul>

          <h2>Блоки (из headless-рендера)</h2>
          <div id="blocks" class="blocks"></div>

          <h2>Сырые OSC-события</h2>
          <div id="osc-log" class="osc-log"></div>
        </section>
      </div>
    </main>
  </body>
</html>
