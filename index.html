<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>terminal-mentor — этап 2</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <main class="shell">
      <header class="toolbar toolbar-connect">
        <button id="btn-mode" title="Ctrl+Shift+M — переключить режим">Режим: Терминал</button>
        <span class="sep"></span>
        <select id="preset-select" title="Сохранённые подключения">
          <option value="">— новое подключение —</option>
        </select>
        <input id="preset-name" placeholder="имя пресета" size="9" />
        <input id="preset-user" placeholder="пользователь" size="8" value="Pakochka" />
        <span class="at">@</span>
        <input id="preset-host" placeholder="хост" size="13" value="192.168.70.167" />
        <input id="preset-port" placeholder="порт" size="4" />
        <input id="preset-key" placeholder="путь к ключу" size="16" value="C:\Users\Pakochka\.ssh\id_ed25519" />
        <button id="btn-ssh" class="btn-primary">Подключиться</button>
        <button id="btn-preset-save" title="Сохранить текущие поля как пресет">Сохранить</button>
        <button id="btn-preset-delete" disabled title="Удалить выбранный пресет">✕</button>

        <details class="dropdown">
          <summary>Дополнительно ▾</summary>
          <div class="dropdown-menu">
            <button id="btn-spawn">Git Bash (локально)</button>
            <button id="btn-integrate" disabled title="Внедрить OSC-хуки для нарезки на блоки в этой сессии">
              Внедрить интеграцию вручную
            </button>
          </div>
        </details>

        <span id="status" class="status">не запущено</span>
      </header>

      <div class="panes">
        <section class="pane pane-term" id="pane-term">
          <h2>Терминал</h2>
          <div id="xterm"></div>
        </section>

        <div class="resizer" id="resizer" title="Перетащи, чтобы изменить соотношение"></div>

        <section class="pane pane-chat">
          <div class="chat-header">
            <button id="btn-glance" disabled title="Разбери последний блок, в обход политики">👁 Глянь</button>
            <h2>Чат с агентом</h2>
            <label class="policy-label">
              Политика
              <select id="agent-policy">
                <option value="auto" selected>Авто</option>
                <option value="errors-only">Только ошибки</option>
                <option value="manual">Вручную</option>
              </select>
            </label>
            <span class="status">
              <span id="agent-dot" class="dot dot-off"></span>
              <span id="agent-status" class="agent-status-toggle" title="Нажми, чтобы запустить/остановить агента">не запущен</span>
            </span>
          </div>
          <div id="chat-log" class="chat-log"></div>
          <form id="chat-form" class="chat-form">
            <textarea id="chat-input" rows="2" placeholder="Сообщение агенту…" disabled></textarea>
            <button id="chat-send" type="submit" class="btn-primary" disabled>➤</button>
          </form>
        </section>

        <section class="pane pane-side" id="pane-side">
          <div class="side-header">
            <button id="btn-side-toggle" class="side-toggle" title="Свернуть/развернуть">⟩</button>
            <h2>Блоки</h2>
          </div>
          <div id="blocks" class="blocks"></div>
        </section>
      </div>
    </main>
  </body>
</html>
